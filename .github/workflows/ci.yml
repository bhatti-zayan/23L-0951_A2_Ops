name: VisionGuard CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"          # same Python as training and the Docker image
          cache: pip
          cache-dependency-path: requirements-app.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt pytest==8.* flake8==7.*
      - name: Lint (flake8)
        run: flake8
      - name: Tests (pytest)
        run: python -m pytest -v

  docker-build:
    needs: lint-and-test                  # only build the image if lint + tests passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the web image
        run: docker build -t 23l-0951_a2_ops-web:ci-${{ github.sha }} .
      - name: Show image size
        run: docker images 23l-0951_a2_ops-web
